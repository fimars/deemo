[package]
name = "deemo"
version = "0.2.0"
edition = "2021"
description = "Persist the stdout of any (long-running) piped process to ~/.deemo — tee with housekeeping"
license = "MIT"
repository = "https://github.com/fimars/deemo"
keywords = ["tee", "logs", "pipe", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
